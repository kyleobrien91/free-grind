# Fix mis-aligned LINKEDIT string pool with Apple's newer linkers
# This applies to compilation FOR macOS (including proc-macros built as part of Android build)
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-args=-Wl,-ld_classic"]

# Use mold linker on Linux — ~10x faster than ld.bfd for linking.
# mold 2.x handles versioned OpenSSL symbols correctly (unlike rust-lld).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[build]
# Use all available cores instead of limiting to 4
jobs = 5
